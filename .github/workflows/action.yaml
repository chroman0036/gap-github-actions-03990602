# 1. The "on" property defines what triggers the workflow
on:
  push:
    branches: [ main ]

# 2. The "jobs" property contains the execution logic
jobs:
  prisma_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Run Checkov SCA Scanning
        id: checkov
        uses: bridgecrewio/checkov-action@master
        env:
          PRISMA_API_URL: https://api2.prismacloud.io
        with:
          output_format: cli
          framework: sca_package
          api-key: 4dca0ab1-7cb7-4932-b89f-bc00499bd84a::D6ZDtgNETWPqjamJu3X7dmCowuU=
          log_level: DEBUG
